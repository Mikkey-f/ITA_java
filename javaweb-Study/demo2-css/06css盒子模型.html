<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        .outerDiv{
            width: 500px;
            height: 300px;
            border: 1px solid green;
            background-color: beige;
            margin: 0px auto; /*auto: 左右平均分配*/

        }
        .innerDiv{
            width: 100px;
            height: 100px;
            border: 1px solid blue;
            float: left;
        }
        /*
        padding：内边距
        margin：外边距


        */
        .d1{
            background-color: greenyellow;
            margin-right: 10px;
            margin-top: 10px;
            margin-left: 10px;
                                /*只写了margin或padding,未指定方向,默认为四周都使用margin/padding方法*/
                                /*margin x y: 分别表示上下和左右外边距*/
            padding-top: 20px;
            padding-left: 20px;
            padding-bottom: 20px;
            padding-right: 20px;
        }
        .d2{
            background-color: rgb(210, 119, 119);
           margin-left: 10px;
        }
        .d3{
            background-color: rgb(143, 209, 215);
            margin: 10px 20px;
            
        }
    </style>
</head>
<body>
    <div class="outerDiv">
        <div class="innerDiv d1">div1</div>
        <div class="innerDiv d2">div2</div>
        <div class="innerDiv d3">div3</div>
    </div>
</body>
</html>
