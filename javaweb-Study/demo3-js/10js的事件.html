<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        /*
        1 事件的绑定机制 
             1 通过元素的属性绑定
             2 通过DOM编程动态绑定
             注意事项:
                  1.一个事件可以同时绑定多个函数
                  2.一个元素可以同时绑定多个事件
        
        2 常见的事件
              1.鼠标事件
              2.键盘事件
              3.表单事件 onfocus onblur onchange
        */
        function fun1(){
            //alert("单击了")
            console.log("单击了")
        }
        function fun2(){
            //alert("单击了2")
            console.log("单击了2")
        }
        function fun3(){
            //alert("双击了")
            console.log("双击了")
        }
        function fun4(){
            console.log("鼠标悬停了")
        }
        function fun5(){
            console.log("鼠标移动了")
        }
        function fun6(){
            console.log("鼠标离开了")
        }
        function fun7(){
            console.log("按键按下了")
        }
        function fun8(){
            console.log("按键抬起了")
        } 
        function testFocus(){
            console.log("获得焦点了")
        }
        function testBlur(){
            console.log("失去焦点了")
        }
        function testChange(value){//value: 可记录具体改变了什么值.
            console.log(value+" 内容改变了") //当焦点移出后才视作改变
        }
        function testChange1(value){
            console.log(value+" 选项改变了")
        }
        function testSubmit(){
            /*
               弹窗的三种方式
               alert()信息提示框
               prompt()信息输入框
               confirm()信息确认框
            */
            //alert("表单提交了")
            //可以阻止表单提交
            var flag=confirm("确定要提交表单吗")
            if(flag){
                return true
            }
            return false
            //event.preventDefault();//阻止组件的默认行为
        }


    </script>
</head>
<body>
      <form action="01js的引入方式.html" method="get" onsubmit="return testSubmit()"> <!--向浏览器返回true/false-->                                             
        用户昵称:<input type="text" name="realname" onfocus="testFocus()" onblur="testBlur()" onchange="testChange(this.value)"> <br>
        登录账号:<input type="text" name="loginname" onfocus="testFocus()" onblur="testBlur()"> <br>
        选择籍贯:
        <select onchange="testChange1( this.value)">
            <option>北京</option>
            <option>上海</option>
            <option>广州</option>
        </select>
        <br>
        <input type="submit" value="注册">
        <input type="reset" value="清空">

      </form>



    
    
    
    
    
    
    
    
      <hr>
    <input type="button"
      value="按钮"
      onclick="fun1(),fun2()"
      ondblclick="fun3()"
    >
    <br>                                                    <!--悬停               移动                       离开-->
    <img src="img/img/1BBAFEED9572DE53611C14323B653521.jpg" onmouseover="fun4()" onmousemove="fun5()" onmouseleave="fun6()">
    <br>
    <input type="text" onkeydown="fun7()" onkeypress="fun8()">
</body>
</html>
