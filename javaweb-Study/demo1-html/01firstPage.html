<!--1.html文件的根标签<html></html>所有的标签都要在这个标签中间
     2.html根标签下有两个子标签
     <head></head> 头标签 定义那些不直接展示在页面主体上，但又很重要的内容
                  1.字符集 <meta charset="UTF-8"/>告诉浏览器用什么字符集对文件解码
                  2.css引入
                  3.js引入
                  4.其他
                   
    <body>  体标签
           1.定义要展示到页面主体的标签
    
-->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <title>Document</title> 
</head>
<body>
    <h1>hello vscode hahaha</h1>
    <input type="password"/> 
    <i><big>张三</big></i>
</body>
</html>
