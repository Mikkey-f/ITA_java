<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<!-- #region 
  有序列表 ol
  无序列表 ul  列表前的提示符没有代表顺序的含义
  列表项 li     可以在里面嵌套其他列表
-->

<!-- #region 有序列表-->
  <ol>
    <li>数据类型</li>
     <li>变量</li>
      <li>流程控制</li>
       <li>函数</li>
        <li>面向对象</li>
  </ol>

  <!-- #region 无序列表-->
  <ul>
    <li>Java</li>
    <li>C</li>
    <li>C#</li>
    <li>php</li>
    <li>python</li>
  </ul>

  <!-- #region 嵌套-->
  <ul>
    <li>Java
        <ol>
             <li>数据类型</li>
             <li>变量</li>
             <li>流程控制</li>
             <li>函数</li>
             <li>面向对象</li>
        </ol>
    </li>
  </ul>
</body>
</html>
